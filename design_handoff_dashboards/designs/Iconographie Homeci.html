/* ══ ICON CARD ══ */
function IconCard({name,Icon,bgMode,onCopy,copied}){
  const [hover,setHover]=useState(false);
  const isDark=bgMode==='dark';
  return(
    <div onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)} onClick={()=>onCopy(name)} style={{
      borderRadius:14,padding:'18px 14px 14px',cursor:'pointer',position:'relative',
      background:isDark?'#0A3D1F':'#FFFFFF',
      border:`1px solid ${isDark?'rgba(212,160,23,0.20)':'rgba(212,160,23,0.15)'}`,
      transition:'all .2s ease',transform:hover?'translateY(-2px)':'',boxShadow:hover?'0 8px 24px rgba(26,14,0,0.08)':'0 1px 3px rgba(26,14,0,0.04)',
    }}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:48,marginBottom:8,color:isDark?'#F5E6C8':'#1A0E00'}} className={copied===name?'pop':''}>
        <Icon size={32}/>
      </div>
      <div style={{fontFamily:'var(--font-mono)',fontSize:9.5,textAlign:'center',color:isDark?'rgba(245,230,200,0.6)':'#8B6A30',fontWeight:600,letterSpacing:'0.02em',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{name}</div>
      <div style={{fontSize:9,textAlign:'center',color:isDark?'rgba(245,230,200,0.4)':'rgba(139,106,48,0.6)',marginTop:2,fontStyle:'italic'}}>{ICON_LABELS[name]||name}</div>
      {copied===name&&(
        <div style={{position:'absolute',top:8,right:8,padding:'2px 7px',borderRadius:6,background:'#009E49',color:'#fff',fontSize:8,fontWeight:800,letterSpacing:'0.04em'}}>COPIÉ</div>
      )}
    </div>
  );
}

/* ══ CATEGORY SECTION ══ */
function CategorySection({cat,query,bgMode,onCopy,copied}){
  const filtered=cat.icons.filter(n=>!query||n.toLowerCase().includes(query.toLowerCase())||(ICON_LABELS[n]||'').toLowerCase().includes(query.toLowerCase()));
  if(filtered.length===0)return null;

  return(
    <section className="fade-in" style={{marginBottom:36}}>
      <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:18}}>
        <div style={{width:34,height:34,borderRadius:9,background:`${cat.color}18`,border:`1.2px solid ${cat.color}40`,display:'flex',alignItems:'center',justifyContent:'center',color:cat.color,fontWeight:900,fontSize:15,fontFamily:'var(--font-cormorant)'}}>{cat.label[0]}</div>
        <div>
          <h2 style={{fontFamily:'var(--font-cormorant)',fontSize:'1.6rem',fontWeight:700,color:'#1A0E00',lineHeight:1}}>{cat.label}</h2>
          <p style={{fontSize:11,color:'#8B6A30',fontWeight:600,marginTop:2,letterSpacing:'0.04em',textTransform:'uppercase',opacity:.7}}>{filtered.length} icône{filtered.length>1?'s':''}</p>
        </div>
        <div style={{flex:1,height:1,background:`linear-gradient(90deg,${cat.color}30,transparent)`,marginLeft:8}}/>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(120px,1fr))',gap:10}}>
        {filtered.map(name=>{
          const Icon=I[name];if(!Icon)return null;
          return <IconCard key={name} name={name} Icon={Icon} bgMode={bgMode} onCopy={onCopy} copied={copied}/>;
        })}
      </div>
    </section>
  );
}

/* ══ HEADER + USAGE ══ */
function PageHeader({query,setQuery,bgMode,setBgMode,total}){
  return(
    <header style={{position:'sticky',top:0,zIndex:30,background:'rgba(255,248,237,0.94)',backdropFilter:'blur(18px)',borderBottom:'1.5px solid rgba(212,160,23,0.15)'}}>
      {/* Kente strip */}
      <div style={{height:3,background:'repeating-linear-gradient(90deg,#FF6B00 0,#FF6B00 14px,#009E49 14px,#009E49 28px,#FFF 28px,#FFF 42px,#D4A017 42px,#D4A017 56px)'}}/>
      <div style={{maxWidth:1280,margin:'0 auto',padding:'18px 32px'}}>
        <div style={{display:'flex',alignItems:'center',gap:18,flexWrap:'wrap'}}>
          {/* Logo */}
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <div style={{width:42,height:42,borderRadius:11,background:'linear-gradient(135deg,#1B5E3A,#0A3D1F)',border:'1.5px solid rgba(212,160,23,0.4)',display:'flex',alignItems:'center',justifyContent:'center'}}>
              <I.adinkra size={24} color="#F5E6C8" accent="#D4A017"/>
            </div>
            <div>
              <h1 style={{fontFamily:'var(--font-cormorant)',fontSize:'1.55rem',fontWeight:700,color:'#1A0E00',lineHeight:1}}>Système d'icônes Homeci</h1>
              <p style={{fontSize:11,color:'#8B6A30',fontWeight:600,marginTop:2,letterSpacing:'0.04em',textTransform:'uppercase'}}>{total} icônes · 8 catégories · Stroke 1.6 · 24×24</p>
            </div>
          </div>

          <div style={{flex:1,minWidth:240,position:'relative'}}>
            <span style={{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)',color:'#8B6A30',opacity:.6}}><I.search size={16}/></span>
            <input type="text" value={query} onChange={e=>setQuery(e.target.value)} placeholder="Rechercher une icône (ex: villa, notaire, kente)" style={{width:'100%',padding:'11px 14px 11px 38px',borderRadius:11,fontSize:13,fontFamily:'var(--font-nunito)',border:'1.5px solid rgba(212,160,23,0.20)',background:'#FFF',color:'#1A0E00'}}/>
          </div>

          {/* Bg toggle */}
          <div style={{display:'flex',background:'rgba(212,160,23,0.08)',borderRadius:10,padding:3,border:'1px solid rgba(212,160,23,0.18)'}}>
            {[{id:'light',l:'☀️ Clair'},{id:'dark',l:'🌙 Sombre'}].map(m=>(
              <button key={m.id} onClick={()=>setBgMode(m.id)} style={{padding:'7px 14px',borderRadius:8,fontSize:11,fontWeight:700,background:bgMode===m.id?'#FFF':'transparent',color:bgMode===m.id?'#1A0E00':'#8B6A30',transition:'all .15s'}}>{m.l}</button>
            ))}
          </div>
        </div>
      </div>
    </header>
  );
}

              {label:'Bien certifié',lucide:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A0E00" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,homeci:<I.notarise size={26}/>,note:'Cachet rond + tampon — métaphore notariale réelle'},
              {label:'Villa',lucide:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A0E00" strokeWidth="1.6"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>,homeci:<I.villa size={26}/>,note:'Toit + détail or + accent solaire (climat CI)'},
              {label:'Mobile Money',lucide:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A0E00" strokeWidth="1.6"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h0"/></svg>,homeci:<I.mobileMoney size={26}/>,note:'Étiquette FCFA explicite — usage Orange Money/Wave'},
              {label:'Sécurité dossier',lucide:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A0E00" strokeWidth="1.6"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,homeci:<I.shield size={26}/>,note:'Bouclier duotone bleu + check intégré'},
              {label:'Notification active',lucide:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A0E00" strokeWidth="1.6"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/></svg>,homeci:<I.bell size={26}/>,note:'Pastille orange intégrée — pas de badge externe'},
            ].map((row,i)=>(
              <div key={i} style={{display:'grid',gridTemplateColumns:'1.2fr 1fr 1fr 2fr',padding:'14px 22px',alignItems:'center',borderBottom:i<4?'1px solid rgba(212,160,23,0.08)':'none'}}>
                <span style={{fontSize:13,fontWeight:700,color:'#1A0E00',fontFamily:'var(--font-cormorant)'}}>{row.label}</span>
                <div style={{opacity:.5}}>{row.lucide}</div>
                <div>{row.homeci}</div>
                <span style={{fontSize:11,color:'#5C3D1E',lineHeight:1.5}}>{row.note}</span>
              </div>
            ))}
          </div>
        </section>

        {/* Footer */}
        <footer style={{marginTop:48,paddingTop:24,borderTop:'1px solid rgba(212,160,23,0.15)',display:'flex',alignItems:'center',justifyContent:'space-between',gap:16,flexWrap:'wrap'}}>

          <div style={{display:'flex',alignItems:'center',gap:8,fontSize:10,color:'#8B6A30',fontWeight:600,letterSpacing:'0.06em',textTransform:'uppercase'}}>
            <I.flagCI size={20}/>

      </main>
    </>
