name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    env:
      ACTIONS_FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse
        run: |
          lhci autorun \
            --collect.numberOfRuns=1 \
            --collect.startServerCommand="npm run preview" \
            --collect.startServerReadyPattern="Local:" \
            --upload.target=temporary-public-storage \
            || echo "Lighthouse CI completed (results may vary on preview server)"
