name: Lighthouse CI (Informational)

# ⚠️ Ce workflow est NON-BLOQUANT (continue-on-error: true).
# Il fournit des métriques de performance à titre indicatif.
# Nécessite que `npm run preview` fonctionne dans l'environnement CI.

on:
  schedule:
    # Exécuté chaque lundi à 9h UTC
    - cron: "0 9 * * 1"
  workflow_dispatch: # Permet le lancement manuel

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      ACTIONS_FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse
        run: |
          lhci autorun \
            --collect.numberOfRuns=1 \
            --collect.startServerCommand="npm run preview" \
            --collect.startServerReadyPattern="Local:" \
            --upload.target=temporary-public-storage \
            2>&1 || echo "⚠️ Lighthouse CI n'a pas pu s'exécuter (serveur preview indisponible)"
